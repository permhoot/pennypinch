{{define "layout"}}
<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pennypinch</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/lib/htmx.min.js" defer></script>
  <script src="/static/lib/chart.umd.js" defer></script>
  <script src="/static/lib/chartjs-chart-sankey.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body data-currency="{{.Currency}}" data-currency-position="{{.CurrencyPosition}}">
  <header class="site-header">
    <div class="brand">Pennypinch</div>
    <nav class="nav">
      <a href="/" class="{{if eq .Active "table"}}active{{end}}">Table</a>
      <a href="/monthly" class="{{if eq .Active "monthly"}}active{{end}}">Monthly</a>
      <a href="/yearly" class="{{if eq .Active "yearly"}}active{{end}}">Yearly</a>
    </nav>
    <div class="actions">
      <a class="btn" href="/api/expenses/export">Export CSV</a>
      <a class="btn" href="/api/import/template">Template</a>
      <button class="btn" id="import-btn" type="button">Import CSV</button>
      <button class="btn" id="theme-toggle" type="button" aria-label="Toggle theme">Theme</button>
    </div>
  </header>

  <input type="file" id="import-file" accept=".csv,text/csv" hidden>

  <main class="container">
    {{template "content" .}}
  </main>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
{{end}}
