{{define "content"}}
<div class="page-head">
  <h1>Yearly Cash Flow</h1>
</div>

<div class="period-nav">
  <a class="btn" href="/yearly?year={{.PrevYear}}">← Prev</a>
  <form method="get" action="/yearly" class="inline-form">
    <input type="number" name="year" value="{{.Year}}" min="2000" max="2100">
    <button class="btn" type="submit">Go</button>
  </form>
  <a class="btn" href="/yearly?year={{.NextYear}}">Next →</a>
</div>

<div class="stats-bar">
  <div class="stat"><span class="label">Income</span><span class="value income">{{formatAmount .Income .Currency .CurrencyPosition}}</span></div>
  <div class="stat"><span class="label">Expenses</span><span class="value expense">{{formatAmount .Expenses .Currency .CurrencyPosition}}</span></div>
  <div class="stat"><span class="label">Net</span><span class="value">{{formatAmount .Net .Currency .CurrencyPosition}}</span></div>
</div>

<div class="chart-panel">
  <canvas id="sankey-chart" aria-label="Yearly cash flow Sankey" role="img"></canvas>
</div>

<script type="application/json" id="sankey-data">{{json .Sankey}}</script>
{{end}}
